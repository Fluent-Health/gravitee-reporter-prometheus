name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and run unit tests
        run: mvn --batch-mode verify

  # Container-backed integration tests against each supported APIM version.
  # The matrix lives in .github/workflows/integration-matrix.yml so CI and
  # Release cannot drift apart.
  integration-test:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/integration-matrix.yml
